
name: Aggiorna risultati FITeT

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Aggiorna tutti i campionati
        run: |
          python strumenti/recupera_risultati.py
          python strumenti/recupera_risultati_b2.py
          python strumenti/recupera_risultati_c1.py
          python strumenti/recupera_risultati_d2.py
          python strumenti/recupera_risultati_d3a.py
          python strumenti/recupera_risultati_d3b.py
          python strumenti/recupera_risultati_cf.py

      - name: Salva i risultati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sito/*.json
          if git diff --cached --quiet; then
            echo "Nessun risultato da aggiornare."
          else
            git commit -m "Aggiornamento automatico risultati FITeT"
            git push
          fi
